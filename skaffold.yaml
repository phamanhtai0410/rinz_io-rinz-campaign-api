apiVersion: skaffold/v2beta28 
kind: Config	
profiles:
  - name: profile-stag
    build:
      tagPolicy:
        gitCommit: {}
      artifacts:
      - image: [CONTAINER_REPO]
        context: .
        docker:
          dockerfile: Dockerfile
    deploy:
        # Using Helm as the deployment strategy
        statusCheckDeadlineSeconds: 300
        helm:
          # Pass the parameters according to  
          releases:
            - name: [IMAGE_NAME]
              chartPath: ./helm-template
              namespace: [NAMESPACE]
              # Location of the chart - here, we use a local chart
              wait: true
              # Path to the values file
              valuesFiles:
              - ./stag.yaml
              artifactOverrides:
                image.repository: [CONTAINER_REPO]
             
          flags:
            upgrade:
              - --install
  - name: profile-prod
    build:
      tagPolicy:
        gitCommit: {}
      artifacts:
      - image: [CONTAINER_REPO]
        context: .
        docker:
          dockerfile: Dockerfile
    deploy:
        # Using Helm as the deployment strategy
        statusCheckDeadlineSeconds: 300
        helm:
          # Pass the parameters according to  
          releases:
            - name: [IMAGE_NAME]
              chartPath: ./helm-template
              namespace: [NAMESPACE]
              # Location of the chart - here, we use a local chart
              wait: true
              # Path to the values file
              valuesFiles:
              - ./prod.yaml
              artifactOverrides:
                image.repository: [CONTAINER_REPO]
             
          flags:
            upgrade:
              - --install